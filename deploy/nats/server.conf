server_name: qy-remote-messages
port: 4222
max_payload: 2MB
jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 2GB
}
tls {
  cert_file: /run/nats-tls/fullchain.pem
  key_file: /run/nats-tls/privkey.pem
}
authorization {
  include ../../run/nats-auth/users.conf
}

# Only on the private Docker network. Public WSS terminates at existing HTTPS.
websocket {
  port: 9222
  no_tls: true
  compression: false
}
