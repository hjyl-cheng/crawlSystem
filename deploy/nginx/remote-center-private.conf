worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log off;
    server_tokens off;
    upstream node_center {
        zone node_center 64k;
        server remote-node-center:3187 resolve;
    }
    upstream rota_reader {
        zone rota_reader 64k;
        server remote-rota-reader:3188 resolve;
    }
    upstream registry {
        zone registry 64k;
        server node-registry:5000 resolve;
    }
    server {
        listen 3443 ssl;
        server_name remote-center-private;
        ssl_certificate /run/tls/server.pem;
        ssl_certificate_key /run/tls/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 512k;
        proxy_read_timeout 20s;
        location = /internal/v1/remote-route { proxy_pass http://rota_reader; }
        location = /internal/node-deployments/prepare { proxy_pass http://node_center; }
        location = /internal/node-deployments/status { proxy_pass http://node_center; }
        location / { return 404; }
    }
    # Reached only through the existing public HTTPS proxy. Uploads and deletes
    # are unavailable here; the administrator pushes via host loopback 35000.
    server {
        listen 3189;
        location = /healthz { return 204; }
        location /v2/ {
            auth_basic "Node image download";
            auth_basic_user_file /run/secrets/registry.htpasswd;
            limit_except GET { deny all; }
            proxy_pass http://registry;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 120s;
            add_header Docker-Distribution-Api-Version "registry/2.0" always;
        }
        location / { return 404; }
    }
}
