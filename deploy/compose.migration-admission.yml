  worker-channel:
    image: qy-allpachong/qybullmq:migration-admission-20260912
  controller:
    image: qy-allpachong/qybullmq:migration-agent-dispatch-20260912
    environment:
      CONTROLLER_THROUGHPUT_ENABLED: "true"
