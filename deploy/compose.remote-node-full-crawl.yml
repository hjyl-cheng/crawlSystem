# Optional release overlay, applied only after P5/P6 gates. The private center.env
# supplies the matching original worker DB/Redis/Rota settings documented in P5.
services:
  remote-node-center:
    environment:
      REMOTE_NODE_FULL_CRAWL_DEPLOYMENT_ENABLED: ${QY_REMOTE_FULL_CRAWL_DEPLOYMENT_ENABLED:-false}
      REMOTE_NODE_FULL_CRAWL_EXECUTION_ENABLED: ${QY_REMOTE_FULL_CRAWL_EXECUTION_ENABLED:-false}
      REMOTE_NODE_FULL_CRAWL_IMAGE: ${QY_REMOTE_FULL_CRAWL_IMAGE:-}
      # Registered deployments are admitted automatically; there is no node allowlist.
      REMOTE_NODE_FULL_CRAWL_PAUSED_WORKERS: ${QY_REMOTE_FULL_CRAWL_PAUSED_WORKERS:-}
      # Deprecated compatibility variable; current code ignores the old fixed
      # slot budget. Keep it available so rollback to an older center remains
      # possible without changing the private Compose source.
      REMOTE_NODE_FULL_CRAWL_TOTAL_SLOTS: ${QY_REMOTE_FULL_CRAWL_TOTAL_SLOTS:-2}
    # Explicitly budget the single local legacy/repair compatibility runtime.
    mem_limit: 1536m
    pids_limit: 192
    tmpfs: ["/tmp:size=128m,mode=1777"]
