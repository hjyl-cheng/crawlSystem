# Kolfinder channel data: PostgreSQL protocol and TLS pass through to the
# existing business-tls endpoint. Only the user's approved server may connect.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    log_format connections '$remote_addr [$time_local] $status '
                           '$bytes_sent $bytes_received $session_time';
    access_log /dev/stdout connections;
    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream business_tls {
        zone business_tls 64k;
        server kollavo-business-tls-1:5432 resolve;
    }

    server {
        listen 5432;
        allow 198.2.251.19;
        deny all;

        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass business_tls;
    }
}
