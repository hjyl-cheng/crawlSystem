basePath: /api/v1
definitions:
  github_com_alpkeskin_rota_core_internal_models.AuthenticationSettings:
    properties:
      enabled:
        description: Enable authentication for proxy requests
        type: boolean
      password:
        description: Password for proxy authentication (write-only)
        type: string
      username:
        description: Username for proxy authentication
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.BulkCreateProxyRequest:
    properties:
      proxies:
        items:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.CreateProxyRequest'
        minItems: 1
        type: array
    required:
    - proxies
    type: object
  github_com_alpkeskin_rota_core_internal_models.BulkDeleteProxyRequest:
    properties:
      ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - ids
    type: object
  github_com_alpkeskin_rota_core_internal_models.BulkTagProxyRequest:
    properties:
      add:
        items:
          type: string
        type: array
      ids:
        items:
          type: integer
        minItems: 1
        type: array
      remove:
        items:
          type: string
        type: array
    required:
    - ids
    type: object
  github_com_alpkeskin_rota_core_internal_models.ChartDataPoint:
    properties:
      time:
        type: string
      value:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.CreateProxyRequest:
    properties:
      address:
        type: string
      password:
        type: string
      protocol:
        enum:
        - http
        - https
        - socks4
        - socks4a
        - socks5
        - vless
        - vmess
        - trojan
        - shadowsocks
        type: string
      source_id:
        description: set internally when importing from a source
        type: integer
      tags:
        items:
          type: string
        type: array
      username:
        type: string
    required:
    - address
    - protocol
    type: object
  github_com_alpkeskin_rota_core_internal_models.DashboardStats:
    properties:
      active_proxies:
        type: integer
      archived_proxies:
        type: integer
      avg_response_time:
        type: integer
      avg_success_rate:
        type: number
      failed_proxies:
        type: integer
      pending_proxies:
        type: integer
      request_growth:
        type: number
      response_time_delta:
        type: integer
      success_rate_growth:
        type: number
      total_proxies:
        type: integer
      total_requests:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.ErrorResponse:
    properties:
      details: {}
      error:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.GeoIPSettings:
    properties:
      auto_update:
        type: boolean
      last_updated_at:
        type: string
      maxmind_db_path:
        type: string
      maxmind_license_key:
        description: Write-only.
        type: string
      maxmind_url:
        type: string
      provider:
        type: string
      update_interval_hours:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.GeoIPStatus:
    properties:
      active_database_path:
        type: string
      auto_update:
        type: boolean
      configured:
        type: boolean
      database_build_time:
        type: string
      database_loaded:
        type: boolean
      database_path:
        type: string
      database_type:
        type: string
      last_error:
        type: string
      last_updated_at:
        type: string
      license_configured:
        type: boolean
      provider:
        type: string
      source:
        type: string
      update_interval_hours:
        type: integer
      updating:
        type: boolean
    type: object
  github_com_alpkeskin_rota_core_internal_models.HealthCheckSettings:
    properties:
      base_status:
        type: integer
      base_url:
        type: string
      headers:
        items:
          type: string
        type: array
      status:
        type: integer
      strict_tls:
        type: boolean
      timeout:
        type: integer
      url:
        type: string
      workers:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.Log:
    properties:
      details:
        type: string
      id:
        type: integer
      level:
        type: string
      message:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      timestamp:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.LogListResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.Log'
        type: array
      pagination:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.PaginationMeta'
    type: object
  github_com_alpkeskin_rota_core_internal_models.LogRetentionSettings:
    properties:
      cleanup_interval_hours:
        description: How often to run cleanup (1, 6, 12, 24)
        type: integer
      compression_after_days:
        description: Compress logs older than X days (1, 3, 7, 14)
        type: integer
      enabled:
        description: Enable automatic log cleanup
        type: boolean
      retention_days:
        description: Days to keep logs (7, 15, 30, 60, 90)
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_alpkeskin_rota_core_internal_models.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.UserInfoResponse'
    type: object
  github_com_alpkeskin_rota_core_internal_models.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.Proxy:
    properties:
      address:
        type: string
      archive_reason:
        type: string
      archived_at:
        type: string
      avg_response_time:
        type: integer
      base_health_status:
        type: string
      city_name:
        type: string
      country_code:
        description: GeoIP fields
        type: string
      country_name:
        type: string
      created_at:
        type: string
      failed_since:
        type: string
      failure_episode_kind:
        type: string
      geo_updated_at:
        type: string
      id:
        type: integer
      isp:
        type: string
      last_check:
        type: string
      last_health_check_at:
        type: string
      last_health_success_at:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      next_health_check_at:
        type: string
      protocol:
        type: string
      region_name:
        type: string
      requests:
        type: integer
      status:
        type: string
      tags:
        description: Tags
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
      youtube_health_status:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.ProxyCleanupSettings:
    properties:
      cleanup_interval_hours:
        description: How often to run cleanup
        type: integer
      enabled:
        description: Enable automatic dead proxy cleanup
        type: boolean
      max_failed_days:
        description: Remove proxies failed for more than N days
        type: integer
      min_success_rate:
        description: Remove proxies with success rate below X% (0 = disabled)
        type: number
    type: object
  github_com_alpkeskin_rota_core_internal_models.ProxyLifecycleSettings:
    properties:
      auto_archive_enabled:
        type: boolean
      hard_unreachable_after_hours:
        type: integer
      soft_unreachable_after_hours:
        type: integer
      youtube_unusable_after_hours:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.ProxyListResponse:
    properties:
      pagination:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.PaginationMeta'
      proxies:
        items:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ProxyWithStats'
        type: array
    type: object
  github_com_alpkeskin_rota_core_internal_models.ProxyTestResult:
    properties:
      address:
        type: string
      base_health_status:
        type: string
      conclusive:
        type: boolean
      control_path_healthy:
        type: boolean
      error:
        type: string
      failure_kind:
        type: string
      id:
        type: integer
      response_time:
        type: integer
      status:
        type: string
      tested_at:
        type: string
      youtube_health_status:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.ProxyWithStats:
    properties:
      address:
        type: string
      archive_reason:
        type: string
      archived_at:
        type: string
      avg_response_time:
        type: integer
      base_health_status:
        type: string
      city_name:
        type: string
      country_code:
        description: GeoIP fields
        type: string
      country_name:
        type: string
      created_at:
        type: string
      failed_since:
        type: string
      failure_episode_kind:
        type: string
      geo_updated_at:
        type: string
      id:
        type: integer
      isp:
        type: string
      last_check:
        type: string
      last_health_check_at:
        type: string
      last_health_success_at:
        type: string
      next_health_check_at:
        type: string
      protocol:
        type: string
      region_name:
        type: string
      requests:
        type: integer
      status:
        type: string
      success_rate:
        type: number
      tags:
        description: Tags
        items:
          type: string
        type: array
      updated_at:
        type: string
      username:
        type: string
      youtube_health_status:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.RateLimitSettings:
    properties:
      enabled:
        type: boolean
      interval:
        description: in seconds
        type: integer
      max_requests:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.ResponseTimeChartData:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ChartDataPoint'
        type: array
    type: object
  github_com_alpkeskin_rota_core_internal_models.RotationSettings:
    properties:
      allowed_protocols:
        description: Empty means all supported protocols.
        items:
          type: string
        type: array
      fallback:
        type: boolean
      fallback_max_retries:
        type: integer
      follow_redirect:
        type: boolean
      max_response_time:
        description: in milliseconds, 0 means no limit
        type: integer
      method:
        type: string
      min_success_rate:
        description: 0-100, 0 means no minimum
        type: number
      remove_unhealthy:
        type: boolean
      retries:
        type: integer
      time_based:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.TimeBasedSettings'
      timeout:
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.Settings:
    properties:
      authentication:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.AuthenticationSettings'
      geoip:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.GeoIPSettings'
      healthcheck:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.HealthCheckSettings'
      log_retention:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.LogRetentionSettings'
      proxy_cleanup:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ProxyCleanupSettings'
      proxy_lifecycle:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ProxyLifecycleSettings'
      rate_limit:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.RateLimitSettings'
      rotation:
        $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.RotationSettings'
    type: object
  github_com_alpkeskin_rota_core_internal_models.SuccessRateChartData:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.SuccessRateDataPoint'
        type: array
    type: object
  github_com_alpkeskin_rota_core_internal_models.SuccessRateDataPoint:
    properties:
      failure:
        type: integer
      success:
        type: integer
      time:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.TimeBasedSettings:
    properties:
      interval:
        description: in seconds
        type: integer
    type: object
  github_com_alpkeskin_rota_core_internal_models.UpdateProxyRequest:
    properties:
      address:
        type: string
      password:
        type: string
      protocol:
        enum:
        - http
        - https
        - socks4
        - socks4a
        - socks5
        - vless
        - vmess
        - trojan
        - shadowsocks
        type: string
      tags:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  github_com_alpkeskin_rota_core_internal_models.UserInfoResponse:
    properties:
      username:
        type: string
    type: object
  internal_api_handlers.CPUMetrics:
    properties:
      cores:
        type: integer
      percentage:
        type: number
    type: object
  internal_api_handlers.DiskMetrics:
    properties:
      free:
        type: integer
      percentage:
        type: number
      total:
        type: integer
      used:
        type: integer
    type: object
  internal_api_handlers.MemoryMetrics:
    properties:
      available:
        type: integer
      percentage:
        type: number
      total:
        type: integer
      used:
        type: integer
    type: object
  internal_api_handlers.RuntimeMetrics:
    properties:
      gc_pause_count:
        type: integer
      goroutines:
        type: integer
      mem_alloc:
        type: integer
      mem_sys:
        type: integer
      threads:
        type: integer
    type: object
  internal_api_handlers.SystemMetrics:
    properties:
      cpu:
        $ref: '#/definitions/internal_api_handlers.CPUMetrics'
      disk:
        $ref: '#/definitions/internal_api_handlers.DiskMetrics'
      memory:
        $ref: '#/definitions/internal_api_handlers.MemoryMetrics'
      runtime:
        $ref: '#/definitions/internal_api_handlers.RuntimeMetrics'
    type: object
host: localhost:8001
info:
  contact:
    name: API Support
    url: https://github.com/alpkeskin/rota
  description: |-
    A high-performance proxy rotation server with health monitoring and intelligent routing
    Provides comprehensive API for managing proxy servers, monitoring their health,
    and configuring rotation strategies.
  license:
    name: LICENSE
    url: https://github.com/alpkeskin/rota/blob/main/LICENSE
  title: Rota Proxy API
  version: 1.0.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and receive JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.LoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: User login
      tags:
      - auth
  /dashboard/charts/response-time:
    get:
      description: Get response time chart data for visualization
      parameters:
      - default: 4h
        description: Time interval (e.g., 4h, 24h)
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chart data
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ResponseTimeChartData'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Response time chart
      tags:
      - dashboard
  /dashboard/charts/success-rate:
    get:
      description: Get success rate chart data for visualization
      parameters:
      - default: 4h
        description: Time interval (e.g., 4h, 24h)
        in: query
        name: interval
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chart data
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.SuccessRateChartData'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Success rate chart
      tags:
      - dashboard
  /dashboard/stats:
    get:
      description: Get dashboard statistics including proxy and request metrics
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard statistics
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.DashboardStats'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Dashboard statistics
      tags:
      - dashboard
  /database/health:
    get:
      description: Check database connection health
      produces:
      - application/json
      responses:
        "200":
          description: Database health information
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Database health
      tags:
      - health
  /database/stats:
    get:
      description: Get database connection pool statistics
      produces:
      - application/json
      responses:
        "200":
          description: Database pool statistics
          schema:
            additionalProperties: true
            type: object
      summary: Database statistics
      tags:
      - health
  /health:
    get:
      description: Check if the API server is running and healthy
      produces:
      - application/json
      responses:
        "200":
          description: Health status information
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /logs:
    get:
      description: Get paginated list of system logs with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 100
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by log level
        in: query
        name: level
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      - description: Filter by source
        in: query
        name: source
        type: string
      - description: Start time (RFC3339)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of logs
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.LogListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: List logs
      tags:
      - logs
  /logs/export:
    get:
      description: Export system logs in various formats (txt, json)
      parameters:
      - default: txt
        description: Export format (txt/json)
        in: query
        name: format
        type: string
      - description: Filter by log level
        in: query
        name: level
        type: string
      - description: Filter by source
        in: query
        name: source
        type: string
      - description: Start time (RFC3339)
        in: query
        name: start_time
        type: string
      - description: End time (RFC3339)
        in: query
        name: end_time
        type: string
      produces:
      - text/plain
      - application/json
      responses:
        "200":
          description: Exported file
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Export logs
      tags:
      - logs
  /metrics/system:
    get:
      description: Get current system resource metrics (CPU, memory, disk, runtime)
      produces:
      - application/json
      responses:
        "200":
          description: System metrics
          schema:
            $ref: '#/definitions/internal_api_handlers.SystemMetrics'
      summary: System metrics
      tags:
      - metrics
  /proxies:
    get:
      description: Get paginated list of proxies with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Search term
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by protocol
        in: query
        name: protocol
        type: string
      - description: Filter by exact tag
        in: query
        name: tag
        type: string
      - description: Sort field
        in: query
        name: sort
        type: string
      - description: Sort order (asc/desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of proxies
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ProxyListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: List proxies
      tags:
      - proxies
    post:
      consumes:
      - application/json
      description: Create a new proxy server
      parameters:
      - description: Proxy details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.CreateProxyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created proxy
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.Proxy'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Create proxy
      tags:
      - proxies
  /proxies/{id}:
    delete:
      description: Delete a proxy server by ID
      parameters:
      - description: Proxy ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Successfully deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alpkeskin_rota_core_internal_models.ErrorResponse'
      summary: Delete proxy
