# Test credentials only. Bound to host loopback by the experiment Compose file.
port: 4222
max_payload: 2MB
jetstream {
  store_dir: /data
  max_memory_store: 32MB
  max_file_store: 128MB
}
authorization {
  users: [
    {user: center, password: isolated-center-only},
    {user: node1, password: isolated-node1-only, permissions: {
      publish: ["probe.results.node1", "probe.heartbeat.node1", "$JS.API.CONSUMER.INFO.PROBE_COMMANDS.node1", "$JS.API.CONSUMER.MSG.NEXT.PROBE_COMMANDS.node1", "$JS.ACK.PROBE_COMMANDS.node1.>"]
      subscribe: ["_INBOX.node1.>"]
    }},
    {user: node2, password: isolated-node2-only, permissions: {
      publish: ["probe.results.node2", "probe.heartbeat.node2", "$JS.API.CONSUMER.INFO.PROBE_COMMANDS.node2", "$JS.API.CONSUMER.MSG.NEXT.PROBE_COMMANDS.node2", "$JS.ACK.PROBE_COMMANDS.node2.>"]
      subscribe: ["_INBOX.node2.>"]
    }}
  ]
}
