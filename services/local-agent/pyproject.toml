[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qy-channel-profile"
version = "0.4.1"
description = "Read-only, Agent-free channel profile data processing module"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
runtime = [
  "fasttext-wheel>=0.9.2,<0.10",
  "lightgbm>=4.5,<5",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<1.17",
]
ml = [
  "fasttext-wheel>=0.9.2,<0.10",
  "lightgbm>=4.5,<5",
  "polars>=1.5,<2",
  "pyarrow>=17,<23",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<1.17",
]
dev = [
  "qy-channel-profile[ml]",
]

[project.scripts]
qy-channel-profile = "qy_channel_profile.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qy_channel_profile = ["catalogs/*.json"]
